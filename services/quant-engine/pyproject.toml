[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmi-quant-engine"
version = "0.1.0"
description = "Precious Metals Intelligence — quantitative engine (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "redis>=5.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "providers", "ingestion", "indicators", "strategies", "scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Query/Depends-in-defaults idiom is intentional here.
# RUF012: strategy default_params are intentionally class-level config dicts
#         (copied into each detection's params before use).
ignore = ["B008", "RUF012"]
